<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP Stock Report PRO (DUAL FORMAT SUPPORT)</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
body { font-family: Arial; font-size: 11px; padding: 12px; background:#f4f6f9; }

table { border-collapse: collapse; width: 100%; background:#fff; }

th,td{
    border:1px solid #333;
    padding:4px;
    font-size:11px;
    text-align:center;
}

thead th{
    position:sticky;
    top:0;
    background:#fff;
    z-index:5;
}

.group-actual{background:#cfe8ff;font-weight:bold;}
.group-ri{background:#d6f5d6;font-weight:bold;}
.group-var{background:#ffd6d6;font-weight:bold;}

.duplicate{background:#fff3cd!important;border:2px solid red!important;}
.pos{color:green;font-weight:bold;}
.neg{color:red;font-weight:bold;}
.total-row{background:#e2e3e5;font-weight:bold;}
</style>
</head>

<body>

<h2>ERP STOCK REPORT PRO (DUAL FORMAT SUPPORT)</h2>

<input type="file" id="fileInput">
<button onclick="exportExcel()">EXPORT</button>

<select id="typeFilter">
<option value="both">Both</option>
<option value="outright" selected>Outright</option>
<option value="csgnmnt">Csgnmnt</option>
</select>

<table>
<thead>
<tr>
<th>Dept</th><th>Department</th><th>Brand</th>
<th>SKU</th><th>Description</th><th>Type</th>

<th colspan="4" class="group-actual">ACT</th>
<th colspan="4" class="group-ri">RI</th>
<th colspan="4" class="group-var">VAR</th>
</tr>

<tr>
<th colspan="6"></th>
<th>Qty</th><th>Cost</th><th>Retail</th><th>MO%</th>
<th>Qty</th><th>Cost</th><th>Retail</th><th>MO%</th>
<th>Qty</th><th>Cost</th><th>Retail</th><th>MO%</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

<script>

let data = [];
let fileName = "ERP";
let detectedFormat = "RA04"; // Default

// ===================== FILE INPUT =====================
document.getElementById("fileInput").addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;

    fileName = file.name.split('.')[0];

    const reader = new FileReader();
    reader.onload = e => parse(e.target.result);
    reader.readAsText(file);
});

// ===================== FILTER =====================
document.getElementById("typeFilter").addEventListener("change", render);

// ===================== CLEAN =====================
function clean(v){
    return (v||"").toString().trim().toUpperCase();
}

// ===================== NUMBER FIX =====================
function toNum(x){
    if(!x) return 0;

    x = x.toString().trim();

    x = x.replace(/[–−]/g,'-');

    let isNeg = false;
    if(x.endsWith('-')){
        isNeg = true;
        x = x.slice(0,-1);
    }

    x = x.replace(/,/g,'').trim();

    let num = parseFloat(x) || 0;

    return isNeg ? -num : num;
}

// ===================== FORMAT =====================
function fmt(n){
    return Number(n || 0).toFixed(2);
}

function fmtInt(n){
    return Math.round(Number(n || 0));
}

// ===================== DETECT FORMAT =====================
function detectFormat(text) {
    const lines = text.split(/\r?\n/);
    
    // Cari Report Code dalam header
    for(let line of lines){
        if(line.includes("Report Code")){
            if(line.includes("RA4A")) {
                detectedFormat = "RA4A";
                return 'format_without_qty';
            }
            if(line.includes("RA04")) {
                detectedFormat = "RA04";
                return 'format_with_qty';
            }
        }
    }
    
    // Jika tiada Report Code, guna kaedah bilangan angka
    for(let line of lines){
        line = line.trim();
        if(!line) continue;
        
        let s = line.match(/^(Outright|Outrgt|Csgnmnt)\s*:?\s*(.*)$/i);
        if(s){
            let nums = s[2].split(/\s+/).map(toNum);
            
            if(nums.length >= 12) {
                detectedFormat = "RA04";
                return 'format_with_qty';
            }
            if(nums.length >= 9) {
                detectedFormat = "RA4A";
                return 'format_without_qty';
            }
        }
    }
    
    detectedFormat = "RA04";
    return 'format_with_qty';
}

// ===================== PARSE =====================
function parse(text){

    const lines = text.split(/\r?\n/);
    data = [];

    // DETECT FORMAT ONCE
    const format = detectFormat(text);
    console.log("Detected format:", format, "Report Code:", detectedFormat);

    let ctx = {};
    let seen = new Set();
    let pendingTotal = null;

    for(let line of lines){

        line = line.replace(/\f/g,'').trim();
        if(!line) continue;

        if(line.includes("PAGE") || line.includes("Report Code")) continue;

        // TOTAL header detect
        if(
            line.toUpperCase().includes("TOTAL") &&
            !line.match(/^(Outright|Outrgt|Csgnmnt)\s*:?/i)
        ){
            pendingTotal = line;
            continue;
        }

        // TOTAL values (support both Outright/Outrgt)
        let totalMatch = line.match(/^(Outright|Outrgt|Csgnmnt)\s*:?\s*(.*)$/i);
        if(pendingTotal && totalMatch){

            let nums = totalMatch[2].split(/\s+/).map(toNum);

            // ==== HANDLE TOTAL ROW BASED ON FORMAT ====
            let values = [];
            if(format === 'format_with_qty') {
                // Format 1: 12 angka (Qty,Cost,Retail,MO% x3)
                values = nums;
            } else {
                // Format 2: 9 angka (Cost,Retail,MO% x3) → expand to 12
                values = [
                    0, nums[0], nums[1], nums[2],  // ACT: Qty=0
                    0, nums[3], nums[4], nums[5],  // RI: Qty=0
                    0, nums[6], nums[7], nums[8]   // VAR: Qty=0
                ];
            }

            data.push({
                totalRow: true,
                dept: ctx.dept || "",
                department: ctx.department || "",
                totalText: pendingTotal,
                type: totalMatch[1],
                values: values
            });

            pendingTotal = null;
            continue;
        }

        // PRODUCT HEADER
        let p = line.match(/^(\d+)\s+(.+?)\s+(\d+)\s+(.+)$/);
        if(p){
            let parts = p[2].split(/\s{2,}/);

            ctx = {
                dept: p[1],
                department: parts[0] || "",
                brand: parts[1] || "",
                sku: p[3],
                description: p[4]
            };
            continue;
        }

        // STOCK LINE (support both Outright/Outrgt)
        let s = line.match(/^(Outright|Outrgt|Csgnmnt)\s*:?\s*(.*)$/i);
        if(s){

            let nums = s[2].split(/\s+/).map(toNum);

            let row = { ...ctx, type: s[1] };

            // ==== HANDLE DATA ROW BASED ON FORMAT ====
            if(format === 'format_with_qty') {
                // Format 1: 12 angka (Qty,Cost,Retail,MO% x3)
                row.act_qty = nums[0];
                row.act_cost = nums[1];
                row.act_retail = nums[2];
                row.act_mo = nums[3];
                
                row.ri_qty = nums[4];
                row.ri_cost = nums[5];
                row.ri_retail = nums[6];
                row.ri_mo = nums[7];
                
                row.var_qty = nums[8];
                row.var_cost = nums[9];
                row.var_retail = nums[10];
                row.var_mo = nums[11];
            } else {
                // Format 2: 9 angka (Cost,Retail,MO% x3)
                row.act_qty = 0;
                row.act_cost = nums[0];
                row.act_retail = nums[1];
                row.act_mo = nums[2];
                
                row.ri_qty = 0;
                row.ri_cost = nums[3];
                row.ri_retail = nums[4];
                row.ri_mo = nums[5];
                
                row.var_qty = 0;
                row.var_cost = nums[6];
                row.var_retail = nums[7];
                row.var_mo = nums[8];
            }

            let key = clean(row.dept + row.brand + row.sku + row.type);
            row.dup = seen.has(key);
            seen.add(key);

            data.push(row);
        }
    }

    render();
}

// ===================== TOTAL ROW HANDLER =====================
function isBrandTotal(r){
    const txt = (r.totalText || "").toUpperCase();
    if(!txt.includes("TOTAL")) return false;

    const nonBrandKeywords = ["DEPARTMENT","STORE","COMPANY","DIVISION","OTHER"];
    for(const kw of nonBrandKeywords){
        if(txt.includes(kw)) return false;
    }

    return true;
}

// ===================== RENDER =====================
function render() {
    const tb = document.getElementById("tbody");
    tb.innerHTML = "";

    const filter = document.getElementById("typeFilter").value;
    const frag = document.createDocumentFragment();

    data.forEach(r => {

        if(!r.totalRow){
            if(filter==="outright" && r.type!=="Outright" && r.type!=="Outrgt") return;
            if(filter==="csgnmnt" && r.type!=="Csgnmnt") return;
        }

        const tr = document.createElement("tr");

        if(r.totalRow){
            tr.classList.add("total-row");

            const brandTotal = isBrandTotal(r);
            let displayValues = [];

            if(brandTotal){
                displayValues = (r.values || []).map(v => fmt(v));
            } else {
                displayValues.push("NA");
                displayValues.push(fmt(r.values?.[0]));
                displayValues.push(fmt(r.values?.[1]));
                displayValues.push(fmt(r.values?.[2]));

                displayValues.push("NA");
                displayValues.push(fmt(r.values?.[3]));
                displayValues.push(fmt(r.values?.[4]));
                displayValues.push(fmt(r.values?.[5]));

                displayValues.push("NA");
                displayValues.push(fmt(r.values?.[6]));
                displayValues.push(fmt(r.values?.[7]));
                displayValues.push(fmt(r.values?.[8]));
            }

            tr.innerHTML = `
                <td colspan="6">${r.totalText} (${r.type})</td>
                ${displayValues.map(v => `<td>${v}</td>`).join("")}
            `;
            frag.appendChild(tr);
            return;
        }

        // NORMAL ROW
        if(r.dup) tr.classList.add("duplicate");

        tr.innerHTML = `
            <td>${r.dept}</td>
            <td>${r.department}</td>
            <td>${r.brand}</td>
            <td>${r.sku}</td>
            <td>${r.description}</td>
            <td>${r.type}</td>

            <td>${fmtInt(r.act_qty)}</td>
            <td>${fmt(r.act_cost)}</td>
            <td>${fmt(r.act_retail)}</td>
            <td>${fmt(r.act_mo)}</td>

            <td>${fmtInt(r.ri_qty)}</td>
            <td>${fmt(r.ri_cost)}</td>
            <td>${fmt(r.ri_retail)}</td>
            <td>${fmt(r.ri_mo)}</td>

            <td class="${Number(r.var_qty)<0?'neg':'pos'}">${Number(r.var_qty)===0?'-':fmtInt(r.var_qty)}</td>
            <td class="${Number(r.var_cost)<0?'neg':'pos'}">${Number(r.var_cost)===0?'-':fmt(r.var_cost)}</td>
            <td class="${Number(r.var_retail)<0?'neg':'pos'}">${Number(r.var_retail)===0?'-':fmt(r.var_retail)}</td>
            <td class="${Number(r.var_mo)<0?'neg':'pos'}">${Number(r.var_mo)===0?'-':fmt(r.var_mo)}</td>
        `;
        frag.appendChild(tr);
    });

    tb.appendChild(frag);
}

// ===================== STYLING =====================
function applyStyles(ws, rows, isSummary=false){
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let R=0; R<=range.e.r; ++R){
        for(let C=0; C<=range.e.c; ++C){
            const cell_address = {c:C, r:R};
            const cell_ref = XLSX.utils.encode_cell(cell_address);
            const cell = ws[cell_ref];
            if(!cell) continue;

            ws['!cols'] = ws['!cols'] || [];
            ws['!cols'][C] = {wch: Math.max(ws['!cols'][C]?.wch||10, String(cell.v||"").length + 2)};

            cell.s = cell.s || {};
            cell.s.border = {
                top: {style:'thin', color:{auto:1}},
                bottom: {style:'thin', color:{auto:1}},
                left: {style:'thin', color:{auto:1}},
                right: {style:'thin', color:{auto:1}}
            };

            if(!isSummary && R>0 && String(cell.v).toUpperCase().includes("TOTAL")){
                cell.s.font = {bold:true};
            }
        }
    }
}

// ===================== EXPORT =====================
function exportExcel() {

    const wb = XLSX.utils.book_new();

    const headers = [
        "dept","department","brand","sku","description","type",
        "act_qty","act_cost","act_retail","act_mo",
        "ri_qty","ri_cost","ri_retail","ri_mo",
        "var_qty","var_cost","var_retail","var_mo"
    ];

    const filter = document.getElementById("typeFilter").value;

    const filteredData = data.filter(r => {
        if (r.totalRow) return true;

        if (filter === "both") return true;
        if (filter === "outright") return r.type === "Outright" || r.type === "Outrgt";
        if (filter === "csgnmnt") return r.type === "Csgnmnt";

        return true;
    });

    const allRows = filteredData.map(r => {

        if (!r.totalRow) return r;

        const brandTotal = isBrandTotal(r);

        if (brandTotal) {
            return {
                dept: r.dept || "",
                department: r.department || "",
                brand: r.brand || "",
                sku: r.sku || "",
                description: r.totalText || "",
                type: r.type,

                act_qty: r.values?.[0] || 0,
                act_cost: r.values?.[1] || 0,
                act_retail: r.values?.[2] || 0,
                act_mo: r.values?.[3] || 0,

                ri_qty: r.values?.[4] || 0,
                ri_cost: r.values?.[5] || 0,
                ri_retail: r.values?.[6] || 0,
                ri_mo: r.values?.[7] || 0,

                var_qty: r.values?.[8] || 0,
                var_cost: r.values?.[9] || 0,
                var_retail: r.values?.[10] || 0,
                var_mo: r.values?.[11] || 0
            };
        } else {
            return {
                dept: r.dept || "",
                department: r.department || "",
                brand: r.brand || "",
                sku: r.sku || "",
                description: r.totalText || "",
                type: r.type,

                act_qty: 0,
                act_cost: r.values?.[0] || 0,
                act_retail: r.values?.[1] || 0,
                act_mo: r.values?.[2] || 0,

                ri_qty: 0,
                ri_cost: r.values?.[3] || 0,
                ri_retail: r.values?.[4] || 0,
                ri_mo: r.values?.[5] || 0,

                var_qty: 0,
                var_cost: r.values?.[6] || 0,
                var_retail: r.values?.[7] || 0,
                var_mo: r.values?.[8] || 0
            };
        }
    });

    // ============================================
    // GUNAKAN detectedFormat UNTUK NAMA TAB
    // ============================================
    const tabPrefix = detectedFormat; // "RA04" atau "RA4A"

    // ALL DATA SHEET
    const wsAll = XLSX.utils.json_to_sheet(allRows, { header: headers });
    applyStyles(wsAll, allRows);
    XLSX.utils.book_append_sheet(wb, wsAll, `${tabPrefix}_ALL_DATA`);

    // VARIANCE SHEET
    const varRows = allRows
        .filter(r => r.var_qty !== 0 || r.var_cost !== 0 || r.var_retail !== 0 || r.var_mo !== 0)
        .map(r => ({
            dept: r.dept,
            department: r.department,
            brand: r.brand,
            sku: r.sku,
            description: r.description,
            type: r.type,
            var_qty: r.var_qty,
            var_cost: r.var_cost,
            var_retail: r.var_retail,
            var_mo: r.var_mo
        }));

    const wsVar = XLSX.utils.json_to_sheet(varRows, {
        header: ["dept","department","brand","sku","description","type","var_qty","var_cost","var_retail","var_mo"]
    });

    applyStyles(wsVar, varRows, true);
    XLSX.utils.book_append_sheet(wb, wsVar, `${tabPrefix}_VARIANCE`);

    // SUMMARY SHEET
    const summaryMap = {};

    allRows.forEach(r => {
        const key = `${r.dept} - ${r.department}`;

        if (!summaryMap[key]) {
            summaryMap[key] = {
                dept: r.dept,
                department: r.department,
                act_qty: 0,
                act_cost: 0,
                ri_qty: 0,
                ri_cost: 0,
                var_qty: 0,
                var_cost: 0
            };
        }

        summaryMap[key].act_qty += r.act_qty || 0;
        summaryMap[key].act_cost += r.act_cost || 0;
        summaryMap[key].ri_qty += r.ri_qty || 0;
        summaryMap[key].ri_cost += r.ri_cost || 0;
        summaryMap[key].var_qty += r.var_qty || 0;
        summaryMap[key].var_cost += r.var_cost || 0;
    });

    const summaryRows = Object.values(summaryMap);

    const wsSummary = XLSX.utils.json_to_sheet(summaryRows, {
        header: ["dept","department","act_qty","act_cost","ri_qty","ri_cost","var_qty","var_cost"]
    });

    applyStyles(wsSummary, summaryRows, true);
    XLSX.utils.book_append_sheet(wb, wsSummary, `${tabPrefix}_SUMMARY`);

    // SHEET BY DEPT
    const deptMap = {};

    allRows.forEach(r => {
        const key = `${r.dept || "NO"} - ${r.department || "NAME"}`;

        if (!deptMap[key]) deptMap[key] = [];
        deptMap[key].push(r);
    });

    Object.entries(deptMap).forEach(([name, rows]) => {

        const ws = XLSX.utils.json_to_sheet(rows, { header: headers });

        applyStyles(ws, rows, true);

        const safeName = `${tabPrefix}_${name.substring(0, 27)}`;

        XLSX.utils.book_append_sheet(wb, ws, safeName);
    });

    const today = new Date().toISOString().slice(0,10);
    const exportName = `${fileName}_${detectedFormat}_${today}.xlsx`;

    XLSX.writeFile(wb, exportName);
}

</script>
</body>
</html>
