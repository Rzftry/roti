<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Roti Garlic + Kos & Untung</titles>
     <link rel="icon" type="image/x-icon" href="/kalk1.ico"> 
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f7f3e9 0%, #fff8ed 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
        }

        .card {
            background: rgba(255, 248, 235, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 35px 30px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 8px 16px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0e2d0;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #4b3a2b;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8b7355;
            background: #ede3d4;
            padding: 4px 16px;
            border-radius: 40px;
        }

        .subhead {
            text-align: center;
            color: #7d6b56;
            font-size: 0.9rem;
            border-bottom: 2px dashed #dccfc0;
            padding-bottom: 14px;
            margin-bottom: 22px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
        }

        .kotak {
            background: white;
            border-radius: 24px;
            padding: 14px 8px 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 6px 12px rgba(180, 140, 100, 0.08);
            border: 1px solid #e9dbcb;
            text-align: center;
            transition: 0.2s;
        }

        .kotak:focus-within {
            border-color: #b3927a;
            box-shadow: 0 0 0 4px rgba(179, 146, 122, 0.15);
        }

        .kotak label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #6b5a48;
            margin-bottom: 8px;
        }

        .kotak input {
            width: 100%;
            padding: 10px 4px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            border: none;
            background: transparent;
            color: #3d2e1e;
            outline: none;
            font-family: inherit;
        }

        .kotak input[type="number"]::-webkit-inner-spin-button,
        .kotak input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .kotak input[type="number"] {
            -moz-appearance: textfield;
        }

        .kotak .unit {
            font-size: 0.7rem;
            color: #a28b74;
            margin-top: 2px;
            font-weight: 500;
        }

        .kotak.highlight {
            background: #fcf7f0;
            border-color: #d5bea8;
        }
        .kotak.output {
            background: #f4ede4;
            border-color: #cfbca9;
        }
        .kotak.output input {
            color: #5b462f;
        }

        .info-bar {
            background: #e8dbce;
            border-radius: 60px;
            padding: 12px 18px;
            margin: 12px 0 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px 12px;
            font-size: 0.85rem;
            color: #3e3227;
        }

        .info-bar span {
            font-weight: 600;
            background: white;
            padding: 2px 14px;
            border-radius: 40px;
            color: #4f3c2b;
        }

        .info-bar .badge {
            background: #b3927a;
            color: white;
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .reset-btn {
            background: #e2d2c0;
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-weight: 600;
            color: #4b3a2b;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 12px;
            letter-spacing: 0.3px;
            border: 1px solid #d2bfab;
        }

        .reset-btn:hover {
            background: #d6c2ad;
            transform: scale(0.98);
        }
        .reset-btn:active {
            background: #cbb49b;
        }

        .cost-section {
            background: #f8f2e9;
            border-radius: 32px;
            padding: 22px 24px 26px;
            border: 1px solid #e2d2c0;
            margin-top: 6px;
        }

        .cost-section h2 {
            font-size: 1.2rem;
            color: #4b3a2b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cost-section h2 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #7d6b56;
            background: #ede3d4;
            padding: 2px 14px;
            border-radius: 40px;
        }

        .cost-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 18px;
            margin-bottom: 16px;
        }

        .cost-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid #e6d7c6;
            font-size: 0.9rem;
        }

        .cost-item .label {
            color: #5b4a38;
            font-weight: 500;
        }

        .cost-item .value {
            font-weight: 700;
            color: #3d2e1e;
        }

        .cost-item .value input {
            width: 70px;
            padding: 4px 6px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid #dccfc0;
            border-radius: 30px;
            background: #fcf7f0;
            color: #3d2e1e;
            outline: none;
        }

        .cost-item .value input:focus {
            border-color: #b3927a;
            background: white;
        }

        .harga-jualan-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: white;
            padding: 10px 18px;
            border-radius: 60px;
            border: 1px solid #d5bea8;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .harga-jualan-row label {
            font-weight: 600;
            color: #4b3a2b;
            font-size: 0.95rem;
        }

        .harga-jualan-row input {
            width: 100px;
            padding: 6px 10px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            border: 1px solid #dccfc0;
            border-radius: 30px;
            background: #fcf7f0;
            color: #3d2e1e;
            outline: none;
        }

        .harga-jualan-row input:focus {
            border-color: #b3927a;
            background: white;
        }

        .harga-jualan-row .hint {
            font-size: 0.75rem;
            color: #8b7355;
        }

        .total-cost-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        .total-card {
            background: white;
            border-radius: 24px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid #e2d2c0;
        }

        .total-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b7355;
            font-weight: 600;
        }

        .total-card .angka {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3d2e1e;
            margin-top: 4px;
        }

        .total-card .angka.keuntungan {
            color: #2a7a4a;
        }

        .total-card .angka.rugi {
            color: #b34a4a;
        }

        .footnote {
            text-align: center;
            font-size: 0.75rem;
            color: #a48d78;
            margin-top: 16px;
            border-top: 1px solid #e2d3c2;
            padding-top: 14px;
        }

        @media (max-width: 550px) {
            .grid-3 {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .kotak input {
                font-size: 1.2rem;
                padding: 8px 2px;
            }
            .cost-grid {
                grid-template-columns: 1fr;
            }
            .total-cost-box {
                grid-template-columns: 1fr 1fr;
            }
            .card {
                padding: 20px 14px 24px;
            }
            .cost-section {
                padding: 16px 14px 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .harga-jualan-row {
                flex-direction: column;
                gap: 8px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>
            🥖 Roti & Garlic
            <small>auto calc</small>
        </h1>
        <div class="subhead">
            🧄 1 batang → 3 potong &nbsp;|&nbsp; 1 pack = 5 ketul
        </div>

        <div class="grid-3">
            <div class="kotak highlight">
                <label for="batang">🥖 Bil. Batang</label>
                <input type="number" id="batang" min="0" step="0.5" value="68">
                <div class="unit">batang</div>
            </div>
            <div class="kotak output">
                <label for="pack">📦 Pack (jual)</label>
                <input type="number" id="pack" min="0" step="0.1" value="40.0">
                <div class="unit">pack (5 ketul)</div>
            </div>
            <div class="kotak output">
                <label for="potong">🔪 Potongan</label>
                <input type="number" id="potong" min="0" step="0.1" value="200.0">
                <div class="unit">ketul</div>
            </div>
        </div>

        <div class="info-bar">
            <span>🧄 1 batang = 3 potong</span>
            <span class="badge">1 pack = 5 ketul</span>
            <span>⚡ auto kira</span>
        </div>

        <button class="reset-btn" id="resetBtn">⟲ Set semula (default 40 pack)</button>
    </div>

    <div class="cost-section">
        <h2>
            💰 Kos & Untung
            <small>auto ikut kuantiti</small>
        </h2>

        <div class="harga-jualan-row">
            <label for="hargaJualan">💵 Harga Jualan Seunit (pack):</label>
            <input type="number" id="hargaJualan" min="0" step="0.01" value="4.50">
            <span class="hint">RM / pack</span>
        </div>

        <div class="cost-grid" id="costGrid">
            <div class="cost-item">
                <span class="label">🥛 Susu (kotak) <span style="font-weight:400;color:#8b7355;" id="qtySusu">x3</span></span>
                <span class="value">
                    RM <input type="number" id="hargaSusu" min="0" step="0.1" value="6.00">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🍄 Mushroom (200g) <span style="font-weight:400;color:#8b7355;" id="qtyMushroom">x2</span></span>
                <span class="value">
                    RM <input type="number" id="hargaMushroom" min="0" step="0.1" value="5.00">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🧈 Butter <span style="font-weight:400;color:#8b7355;" id="qtyButter">x1</span></span>
                <span class="value">
                    RM <input type="number" id="hargaButter" min="0" step="0.1" value="6.00">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🧄 Garlic (125g) <span style="font-weight:400;color:#8b7355;" id="qtyGarlic">x1</span></span>
                <span class="value">
                    RM <input type="number" id="hargaGarlic" min="0" step="0.01" value="1.25">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🥤 Cup + Box <span style="font-weight:400;color:#8b7355;" id="qtyCup">x40</span></span>
                <span class="value">
                    RM <input type="number" id="hargaCup" min="0" step="0.01" value="0.50">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🧅 Bawang Holland <span style="font-weight:400;color:#8b7355;" id="qtyBawang">x1</span></span>
                <span class="value">
                    RM <input type="number" id="hargaBawang" min="0" step="0.1" value="1.00">
                </span>
            </div>
            <div class="cost-item">
                <span class="label">🥖 Roti (sebatang) <span style="font-weight:400;color:#8b7355;" id="qtyRoti">x68</span></span>
                <span class="value">
                    RM <input type="number" id="hargaRoti" min="0" step="0.01" value="0.33">
                </span>
            </div>
        </div>

        <div class="total-cost-box">
            <div class="total-card">
                <div class="label">💸 Jumlah Kos</div>
                <div class="angka" id="totalKos">RM 0.00</div>
            </div>
            <div class="total-card">
                <div class="label">💰 Hasil Jualan</div>
                <div class="angka" id="hasilJualan">RM 0.00</div>
            </div>
            <div class="total-card">
                <div class="label">📈 Untung / Rugi</div>
                <div class="angka" id="untungRugi">RM 0.00</div>
            </div>
        </div>

        <div class="footnote">
            ✦ Projek Nadiah ✦ Mushroom Soup Garlic Bread ✦ Since Nov2024
        </div>
    </div>

</div>

<script>
    (function() {
        const batangInput = document.getElementById('batang');
        const packInput = document.getElementById('pack');
        const potongInput = document.getElementById('potong');

        const hargaJualan = document.getElementById('hargaJualan');
        const hargaSusu = document.getElementById('hargaSusu');
        const hargaMushroom = document.getElementById('hargaMushroom');
        const hargaButter = document.getElementById('hargaButter');
        const hargaGarlic = document.getElementById('hargaGarlic');
        const hargaCup = document.getElementById('hargaCup');
        const hargaBawang = document.getElementById('hargaBawang');
        const hargaRoti = document.getElementById('hargaRoti');

        const totalKosEl = document.getElementById('totalKos');
        const hasilJualanEl = document.getElementById('hasilJualan');
        const untungRugiEl = document.getElementById('untungRugi');

        const qtySusu = document.getElementById('qtySusu');
        const qtyMushroom = document.getElementById('qtyMushroom');
        const qtyButter = document.getElementById('qtyButter');
        const qtyGarlic = document.getElementById('qtyGarlic');
        const qtyCup = document.getElementById('qtyCup');
        const qtyBawang = document.getElementById('qtyBawang');
        const qtyRoti = document.getElementById('qtyRoti');

        // BASE untuk 40 pack (68 batang)
        const BASE_PACK = 40;
        const BASE_BATANG = 68;
        const BASE_SUSU = 3;
        const BASE_MUSHROOM = 2;
        const BASE_BUTTER = 1;
        const BASE_GARLIC = 1;      // 125g (1 pek)
        const BASE_CUP = 40;
        const BASE_BAWANG = 1;

        const POTONGAN_PER_BATANG = 3;
        const KETUL_PER_PACK = 5;

        let isUpdating = false;

        function updateFromBatang(val) {
            if (isUpdating) return;
            isUpdating = true;
            let btg = parseFloat(val);
            if (isNaN(btg) || btg < 0) btg = 0;
            let totalPotong = btg * POTONGAN_PER_BATANG;
            let pack = totalPotong / KETUL_PER_PACK;
            packInput.value = (Math.round(pack * 10) / 10).toFixed(1);
            potongInput.value = (Math.round(totalPotong * 10) / 10).toFixed(1);
            isUpdating = false;
            kiraKosDanUntung();
        }

        function updateFromPack(val) {
            if (isUpdating) return;
            isUpdating = true;
            let p = parseFloat(val);
            if (isNaN(p) || p < 0) p = 0;
            let totalKetul = p * KETUL_PER_PACK;
            let btg = totalKetul / POTONGAN_PER_BATANG;
            batangInput.value = (Math.round(btg * 10) / 10).toFixed(1);
            potongInput.value = (Math.round(totalKetul * 10) / 10).toFixed(1);
            isUpdating = false;
            kiraKosDanUntung();
        }

        function updateFromPotong(val) {
            if (isUpdating) return;
            isUpdating = true;
            let ptg = parseFloat(val);
            if (isNaN(ptg) || ptg < 0) ptg = 0;
            let btg = ptg / POTONGAN_PER_BATANG;
            let p = ptg / KETUL_PER_PACK;
            batangInput.value = (Math.round(btg * 10) / 10).toFixed(1);
            packInput.value = (Math.round(p * 10) / 10).toFixed(1);
            isUpdating = false;
            kiraKosDanUntung();
        }

        function kiraKosDanUntung() {
            const packValue = parseFloat(packInput.value) || 0;
            const ratio = packValue / BASE_PACK;

            // Kira kuantiti berdasarkan ratio
            const qtySusuVal = BASE_SUSU * ratio;
            const qtyMushroomVal = BASE_MUSHROOM * ratio;
            const qtyButterVal = BASE_BUTTER * ratio;
            const qtyGarlicVal = BASE_GARLIC * ratio;
            const qtyCupVal = BASE_CUP * ratio;
            const qtyBawangVal = BASE_BAWANG * ratio;
            const qtyRotiVal = parseFloat(batangInput.value) || 0;

            // Update display kuantiti
            qtySusu.textContent = 'x' + qtySusuVal.toFixed(1);
            qtyMushroom.textContent = 'x' + qtyMushroomVal.toFixed(1);
            qtyButter.textContent = 'x' + qtyButterVal.toFixed(1);
            qtyGarlic.textContent = 'x' + qtyGarlicVal.toFixed(1);
            qtyCup.textContent = 'x' + qtyCupVal.toFixed(1);
            qtyBawang.textContent = 'x' + qtyBawangVal.toFixed(1);
            qtyRoti.textContent = 'x' + qtyRotiVal.toFixed(1);

            // Baca harga
            const hJualan = parseFloat(hargaJualan.value) || 0;
            const hSusu = parseFloat(hargaSusu.value) || 0;
            const hMushroom = parseFloat(hargaMushroom.value) || 0;
            const hButter = parseFloat(hargaButter.value) || 0;
            const hGarlic = parseFloat(hargaGarlic.value) || 0;
            const hCup = parseFloat(hargaCup.value) || 0;
            const hBawang = parseFloat(hargaBawang.value) || 0;
            const hRoti = parseFloat(hargaRoti.value) || 0;

            // Kira kos
            const kosSusu = hSusu * qtySusuVal;
            const kosMushroom = hMushroom * qtyMushroomVal;
            const kosButter = hButter * qtyButterVal;
            const kosGarlic = hGarlic * qtyGarlicVal;
            const kosCup = hCup * qtyCupVal;
            const kosBawang = hBawang * qtyBawangVal;
            const kosRoti = hRoti * qtyRotiVal;

            const totalKos = kosSusu + kosMushroom + kosButter + kosGarlic + kosCup + kosBawang + kosRoti;
            const hasilJualan = packValue * hJualan;
            const untungRugi = hasilJualan - totalKos;

            totalKosEl.textContent = 'RM ' + totalKos.toFixed(2);
            hasilJualanEl.textContent = 'RM ' + hasilJualan.toFixed(2);
            untungRugiEl.textContent = 'RM ' + untungRugi.toFixed(2);

            if (untungRugi >= 0) {
                untungRugiEl.className = 'angka keuntungan';
            } else {
                untungRugiEl.className = 'angka rugi';
            }
        }

        // Event listeners utama
        batangInput.addEventListener('input', function(e) {
            if (e.target.value === '' || e.target.value === '-') return;
            updateFromBatang(e.target.value);
        });

        packInput.addEventListener('input', function(e) {
            if (e.target.value === '' || e.target.value === '-') return;
            updateFromPack(e.target.value);
        });

        potongInput.addEventListener('input', function(e) {
            if (e.target.value === '' || e.target.value === '-') return;
            updateFromPotong(e.target.value);
        });

        // Event listeners kos & harga jualan
        const allCostInputs = [hargaJualan, hargaSusu, hargaMushroom, hargaButter, hargaGarlic, hargaCup, hargaBawang, hargaRoti];
        allCostInputs.forEach(inp => {
            inp.addEventListener('input', kiraKosDanUntung);
            inp.addEventListener('change', kiraKosDanUntung);
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', function() {
            isUpdating = true;
            batangInput.value = '68';
            packInput.value = '40.0';
            potongInput.value = '200.0';
            isUpdating = false;
            hargaJualan.value = '4.50';
            hargaSusu.value = '6.00';
            hargaMushroom.value = '5.00';
            hargaButter.value = '6.00';
            hargaGarlic.value = '1.25';
            hargaCup.value = '0.50';
            hargaBawang.value = '1.00';
            hargaRoti.value = '0.33';
            kiraKosDanUntung();
        });

        // Handle empty / negatif
        const allNumberInputs = [batangInput, packInput, potongInput, ...allCostInputs];
        allNumberInputs.forEach(inp => {
            inp.addEventListener('blur', function() {
                if (this.value === '' || this.value === '-') {
                    this.value = '0';
                    this.dispatchEvent(new Event('input'));
                }
            });
            inp.addEventListener('change', function() {
                let v = parseFloat(this.value);
                if (isNaN(v) || v < 0) {
                    this.value = '0';
                    this.dispatchEvent(new Event('input'));
                }
            });
        });

        // Init
        batangInput.value = '68';
        packInput.value = '40.0';
        potongInput.value = '200.0';
        hargaJualan.value = '4.50';
        hargaSusu.value = '6.00';
        hargaMushroom.value = '5.00';
        hargaButter.value = '6.00';
        hargaGarlic.value = '1.25';
        hargaCup.value = '0.50';
        hargaBawang.value = '1.00';
        hargaRoti.value = '0.33';
        kiraKosDanUntung();

        console.log('🧮 Kalkulator roti + kos (dengan garlic!) sedia!');
    })();
</script>

</body>
</html>
